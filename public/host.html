<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Host Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Dark on purpose: it sits next to the host during the game and shouldn't light up the room. */
  :root { --gold: #f2bd4b; --dim: #ffffff99; --card: #10132e; --line: #ffffff1a; --green: #22b455; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
  body { font-family: system-ui, sans-serif; padding: 12px 14px calc(18px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; font-family: Oswald, sans-serif; text-transform: uppercase; }
  header .t { flex: 1; font-size: 18px; letter-spacing: .5px; color: var(--dim); }
  header .room { font-size: 18px; color: var(--gold); letter-spacing: 3px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d83a33; }
  .dot.on { background: var(--green); }
  .label { font-family: Oswald, sans-serif; text-transform: uppercase; color: var(--dim); font-size: 15px; letter-spacing: .5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: Oswald, sans-serif; text-transform: uppercase; }
  .meta .cat { font-size: 20px; }
  .meta .val { font-size: 24px; color: var(--gold); font-weight: 700; white-space: nowrap; }
  .clue { font-size: 18px; line-height: 1.4; color: #ffffffd0; margin-top: 10px; }
  .answer { font-family: Oswald, sans-serif; color: var(--gold); font-size: 34px; line-height: 1.15; font-weight: 700; margin-top: 6px; transition: filter .2s; cursor: pointer; }
  .answer.hidden { filter: blur(14px); }
  .hint { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .big { font-family: Oswald, sans-serif; font-size: 30px; text-transform: uppercase; }
  .tag { display: inline-block; font-family: Oswald, sans-serif; text-transform: uppercase; font-size: 15px; padding: 3px 10px; border-radius: 99px; background: #ffffff1f; margin-top: 10px; }
  .tag.buzz { background: var(--gold); color: #1a1200; font-size: 20px; }
  .tag.open { background: var(--green); }
  .tag.dd { background: #d83a33; }
  .scores { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .score { display: flex; justify-content: space-between; font-size: 18px; }
  .score b { font-family: Oswald, sans-serif; color: var(--gold); font-weight: 700; }
  .score b.neg { color: #ff7a72; }
  input { width: 100%; font-size: 22px; padding: 12px; border-radius: 10px; border: 0; margin-top: 10px; }
  button { font: 700 20px Oswald, sans-serif; text-transform: uppercase; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--gold); color: #1a1200; margin-top: 10px; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row button { flex: 1; background: #ffffff1f; color: #fff; font-size: 15px; margin: 0; padding: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="pairbox"></div>
<script>
'use strict';
// Host cards: the host's private view, on a phone beside the TV.
// It shows the answer to whatever clue is on the TV. It needs the host key,
// and the server never sends this information to players' phones.

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US');

let key = new URLSearchParams(location.search).get('key');
if (key) history.replaceState(null, '', location.pathname); // don't leave the key showing in the address bar
try { if (key) localStorage.setItem('nj-host-key', key); else key = localStorage.getItem('nj-host-key'); } catch (e) {}
let hideAnswers = false;
try { hideAnswers = localStorage.getItem('nj-host-hide') === '1'; } catch (e) {}
let peek = false;   // answer revealed by a tap while "hide answers" is on
let state = null;
let es = null;
let connected = false;

function askForKey(msg) {
  if (es) { es.close(); es = null; }
  $('#app').innerHTML = `
    <header><span class="t">Host cards</span></header>
    <div class="card">
      <div class="big">Host key</div>
      <p class="hint">${esc(msg || 'Enter the host key from your TV link (the part after ?key=).')}</p>
      <input id="k" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="go">Open host cards</button>
    </div>`;
  $('#go').onclick = () => {
    key = $('#k').value.trim();
    if (!key) return;
    try { localStorage.setItem('nj-host-key', key); } catch (e) {}
    connect();
    showPairBox();
  };
}

function connect() {
  if (es) es.close();
  es = new EventSource('events?role=host&key=' + encodeURIComponent(key));
  es.onopen = () => { connected = true; render(); };
  es.onerror = () => { connected = false; render(); };
  es.onmessage = (e) => {
    const prev = state;
    state = JSON.parse(e.data);
    connected = true;
    // A new clue means the answer starts hidden again (when hiding is on).
    if (!prev || !prev.view || !state.view || prev.view.answer !== state.view.answer) peek = false;
    if (prev && prev.phase !== 'buzzed' && state.phase === 'buzzed' && navigator.vibrate) navigator.vibrate(80);
    render();
  };
  es.addEventListener('kicked', () => {
    document.getElementById('pairbox').innerHTML = '';
    try { localStorage.removeItem('nj-host-key'); } catch (e) {}
    askForKey('That host key was not accepted. Check the link the server printed.');
  });
  keepAwake();
}

// Ask the phone not to dim its screen during the game (where the browser allows it).
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

function answerHtml(text) {
  const hidden = hideAnswers && !peek;
  return `<div class="label">Answer</div>
    <div class="answer ${hidden ? 'hidden' : ''}" id="answer">${esc(text)}</div>
    ${hideAnswers ? `<div class="hint">${hidden ? 'Tap to peek' : 'Tap to hide'}</div>` : ''}`;
}

function buzzTag(s) {
  if (s.phase === 'buzzed' && s.teams[s.winner] != null) return `<span class="tag buzz">${esc(s.teams[s.winner])} buzzed in</span>`;
  if (s.phase === 'open') return `<span class="tag open">Buzzers open</span>`;
  return '';
}

function mainCard(s) {
  const v = s.view || {};
  switch (v.screen) {
    case 'clue':
    case 'dd':
    case 'dd-wager':
      return `<div class="card">
        <div class="meta"><span class="cat">${esc(v.category)}</span><span class="val">${money(v.dd && v.wager != null ? v.wager : v.value)}</span></div>
        ${v.dd ? `<span class="tag dd">Daily Double${v.screen === 'clue' ? '' : ' · waiting for the wager'}</span>` : ''}
        <div class="clue">${esc(v.clue)}</div>
      </div>
      <div class="card">${answerHtml(v.answer)}${v.screen === 'clue' ? `<div>${buzzTag(s)}</div>` : ''}</div>`;
    case 'final-cat':
    case 'final-clue':
    case 'final-judge':
      return `<div class="card">
        <div class="meta"><span class="cat">Final Jeopardy</span><span class="val">${esc(v.category)}</span></div>
        <div class="clue">${esc(v.clue)}</div>
      </div>
      <div class="card">${answerHtml(v.answer)}</div>`;
    case 'board':
      return `<div class="card"><div class="big">Pick the next clue</div>
        <p class="hint">${esc(v.round || '')}${v.left != null ? ` · ${v.left} clue${v.left === 1 ? '' : 's'} left` : ''}</p></div>`;
    case 'round-end':
      return `<div class="card"><div class="big">End of ${esc(v.round || 'the round')}</div></div>`;
    case 'game-over':
      return `<div class="card"><div class="big">Game over</div></div>`;
    case 'lobby':
      return `<div class="card"><div class="big">Lobby</div>
        <p class="hint">Teams joined: ${s.teams.length ? s.teams.map(esc).join(', ') : 'none yet'}</p></div>`;
    default:
      return `<div class="card"><div class="big">Waiting for the TV</div>
        <p class="hint">Pick a game on the TV and this page follows along.</p></div>`;
  }
}

function render() {
  if (!state) {
    $('#app').innerHTML = `<header><span class="t">Host cards</span><span class="dot ${connected ? 'on' : ''}"></span></header>
      <div class="card"><p class="hint">Connecting…</p></div>`;
    return;
  }
  const s = state;
  const scores = s.teams.length && s.view && !['lobby', 'home'].includes(s.view.screen)
    ? `<div class="card"><div class="label">Scores</div><div class="scores">${s.teams.map((t, i) => {
        const sc = s.scores[i] || 0;
        return `<div class="score"><span>${esc(t)}</span><b class="${sc < 0 ? 'neg' : ''}">${money(sc)}</b></div>`;
      }).join('')}</div></div>` : '';
  $('#app').innerHTML = `
    <header><span class="t">Host cards</span>${s.code ? `<span class="room">${esc(s.code)}</span>` : ''}<span class="dot ${connected ? 'on' : ''}" title="${connected ? 'Connected' : 'Reconnecting'}"></span></header>
    ${mainCard(s)}
    ${scores}
    <div class="row"><button id="hide">${hideAnswers ? 'Always show answers' : 'Hide answers until I tap'}</button></div>`;
  const a = $('#answer');
  if (a && hideAnswers) a.onclick = () => { peek = !peek; render(); };
  updatePairBox();
  $('#hide').onclick = () => {
    hideAnswers = !hideAnswers; peek = false;
    try { localStorage.setItem('nj-host-hide', hideAnswers ? '1' : '0'); } catch (e) {}
    render();
  };
}

// "Connect a TV": the TV shows a 4-digit code; typing it here hands the TV the host key.
// It sits outside #app so live updates never wipe what you're typing.
// While a TV is connected the box is hidden, with a small link to bring it back.
let wantPair = false; // true after tapping "Connect another TV"
function updatePairBox() {
  const card = document.getElementById('paircard'), more = document.getElementById('pairmore');
  if (!card) return;
  const tvOn = !!(state && connected && state.tvs > 0);
  if (!tvOn) wantPair = false;
  card.style.display = tvOn && !wantPair ? 'none' : '';
  more.style.display = tvOn && !wantPair ? '' : 'none';
}
function showPairBox() {
  const box = document.getElementById('pairbox');
  if (box.innerHTML) return;
  box.innerHTML = `<div class="row" id="pairmore" style="display:none"><button id="pairopen">Connect another TV</button></div>
  <div class="card" id="paircard">
    <div class="label">Connect a TV</div>
    <p class="hint">Open the game on the TV. It shows a 4-digit number (not the room code). Type that number here, and that TV becomes the host board.</p>
    <input id="pc" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="4 digits" style="font-size:30px;letter-spacing:4px;text-align:center">
    <button id="pairgo">Connect TV</button>
    <p class="hint" id="pairmsg"></p>
  </div>`;
  const go = async () => {
    const msg = document.getElementById('pairmsg');
    const code = document.getElementById('pc').value.trim();
    if (!code) return;
    msg.textContent = 'Connecting…';
    try {
      const r = await fetch('api/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, pair: code }) });
      const d = await r.json().catch(() => ({}));
      msg.textContent = r.ok ? 'Connected! The TV is now the host board.' : (d.error || 'That did not work.');
      if (r.ok) { document.getElementById('pc').value = ''; wantPair = false; setTimeout(() => { msg.textContent = ''; updatePairBox(); }, 2500); }
    } catch (e) { msg.textContent = 'Could not reach the server.'; }
  };
  document.getElementById('pairopen').onclick = () => { wantPair = true; updatePairBox(); };
  document.getElementById('pairgo').onclick = go;
  updatePairBox();
  document.getElementById('pc').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
}

if (key) { render(); connect(); showPairBox(); } else askForKey();
</script>
</body>
</html>
